<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeeSetu — विद्यार्थी पुष्टि</title><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><header class="topbar"><div class="brand"><img class="brand-logo" src="/assets/branding/04_feesetu_branding_with_logo_slot.png"><div><h1 data-brand>संस्था का नाम</h1><p data-tagline>विद्यार्थी शुल्क भुगतान कियोस्क</p></div></div><div class="spacer"></div><div class="clock">--:--:--</div></header><main class="main"><section class="card"><div class="hero"><div><h2>विद्यार्थी पुष्टि</h2><p>कृपया जानकारी जाँचकर आगे बढ़ें</p></div><button onclick="history.back()">← वापस</button></div><div id="content"></div></section></main></div><script>async function go(){let q=new URLSearchParams(location.search);let r=await fetch('/api/search?type='+q.get('type')+'&value='+q.get('value'));if(!r.ok){document.getElementById('content').innerHTML='<div class="notice">रिकॉर्ड नहीं मिला</div>';return}let s=await r.json();window.student=s;document.getElementById('content').innerHTML=`<div class="student-grid"><div><div class="student-head"><img class="student-photo" src="${s.photo||'/assets/profile/no_photo.png'}"><div><h2>${s.name||'-'}</h2><p>${s.course||'-'} • सत्र ${s.session||'-'}</p></div></div><div class="detail"><div><span>नामांकन क्रमांक</span><strong>${s.enrollment}</strong></div><div><span>रोल नंबर</span><strong>${s.roll}</strong></div><div><span>पिता का नाम</span><strong>${s.father||'-'}</strong></div><div><span>मोबाइल</span><strong>${s.mobile}</strong></div></div></div><div class="fee-list"><h3>देय शुल्क</h3><div class="fee-row"><span>सेमेस्टर शुल्क</span><strong>₹ 2,972</strong></div><div class="paybox"><div><small>कुल देय राशि</small><h2>₹ 2,972</h2></div><button class="next" onclick="pay()">भुगतान करें</button></div></div></div>`}async function pay(){let r=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student:window.student,amount:2972})});let p=await r.json();location.href='/receipt.html?receipt='+p.receipt}go()</script></body></html>
