<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeeSetu — रसीद</title><link rel="stylesheet" href="/styles.css"><style>@media print{.no-print{display:none!important}body{background:#fff}.receipt{box-shadow:none}}</style></head><body><div class="app"><main class="main"><div class="receipt" id="receipt">लोड हो रहा है...</div></main></div><script>async function go(){let id=new URLSearchParams(location.search).get('receipt');let [p,s]=await Promise.all([fetch('/api/payment/'+id).then(r=>r.json()),fetch('/api/settings').then(r=>r.json())]);let logo=s.logo||'';document.getElementById('receipt').innerHTML=`<img class="receipt-header" src="/assets/receipt/10_receipt_header_generic.png"><h2 class="receipt-title">${s.receiptTitle||'शुल्क भुगतान रसीद'}</h2><table class="receipt-table"><tr><th>विवरण</th><th>जानकारी</th></tr><tr><td>रसीद क्रमांक</td><td>${p.receipt}</td></tr><tr><td>विद्यार्थी</td><td>${p.student.name}</td></tr><tr><td>नामांकन क्रमांक</td><td>${p.student.enrollment}</td></tr><tr><td>रोल नंबर</td><td>${p.student.roll}</td></tr><tr><td>कोर्स / सत्र</td><td>${p.student.course} / ${p.student.session}</td></tr><tr><td>भुगतान राशि</td><td><b>₹ ${p.amount.toLocaleString('en-IN')}</b></td></tr><tr><td>स्थिति</td><td><b>सफल</b></td></tr><tr><td>दिनांक</td><td>${new Date(p.createdAt).toLocaleString('hi-IN')}</td></tr></table><div class="print-actions no-print"><button class="next" onclick="print()">🖨️ रसीद प्रिंट करें</button><button class="next" onclick="location.href='/'">नई खोज</button></div>`}go()</script></body></html>
